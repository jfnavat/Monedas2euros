<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EuroNumis Cloud</title>
    <style>
        :root { --primary: #1e3a8a; --secondary: #eab308; --success: #16a34a; --danger: #dc2626; --bg: #f8fafc; --card-bg: #ffffff; --text: #334155; --border: #e2e8f0; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 20px; }
        header { background: linear-gradient(135deg, var(--primary), #0f172a); color: white; padding: 30px; border-radius: 12px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; }
        .header-title h1 { color: var(--secondary); font-size: 2rem; margin-bottom: 5px; }
        .stats-panel { background: rgba(255, 255, 255, 0.1); padding: 15px 25px; border-radius: 8px; }
        .stats-panel p { margin: 3px 0; font-size: 0.95rem; }
        .stats-panel span { font-weight: bold; color: var(--secondary); font-size: 1.2rem; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn-excel { background-color: var(--success); color: white; }
        .btn-excel:hover { background-color: #15803d; }
        .btn-add { background-color: var(--secondary); color: #0f172a; }
        .btn-add:hover { background-color: #ca8a04; }
        .btn-danger { background-color: var(--danger); color: white; padding: 6px 12px; font-size: 0.8rem; border-radius: 4px; border: none; cursor: pointer; }
        .btn-edit { background-color: #64748b; color: white; padding: 6px 12px; font-size: 0.8rem; border-radius: 4px; border: none; cursor: pointer; }
        .admin-section { background: var(--card-bg); padding: 20px; border-radius: 12px; margin-bottom: 25px; border: 1px dashed var(--primary); display: none; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-top: 15px; }
        .filters-section { background: var(--card-bg); padding: 20px; border-radius: 12px; margin-bottom: 25px; box-shadow: 0 1px 3px rgb(0 0 0 / 0.1); display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }
        .filter-group { display: flex; flex-direction: column; gap: 5px; }
        .filter-group label { font-size: 0.85rem; font-weight: 600; color: #64748b; }
        .filter-group input, .filter-group select { padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem; width: 100%; }
        .coins-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        .coin-card { background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; position: relative; transition: transform 0.2s; display: flex; flex-direction: column; }
        .coin-card:hover { transform: translateY(-5px); }
        .coin-img-container { width: 100%; height: 180px; background-color: #f1f5f9; display: flex; align-items: center; justify-content: center; overflow: hidden; border-bottom: 1px solid var(--border); position: relative; }
        .coin-img-container img { width: auto; height: 100%; object-fit: contain; }
        .no-img-text { color: #94a3b8; font-size: 0.9rem; font-style: italic; }
        .coin-badge { position: absolute; top: 15px; right: 15px; padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; z-index: 10; }
        .badge-conmemorativa { background-color: #fee2e2; color: #991b1b; }
        .badge-regular { background-color: #e0f2fe; color: #075985; }
        .coin-info { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; }
        .coin-country-year { font-size: 0.85rem; text-transform: uppercase; font-weight: bold; color: #64748b; }
        .coin-theme { font-size: 1.1rem; font-weight: 700; color: var(--primary); margin: 8px 0; min-height: 50px; }
        .coin-mintage { font-size: 0.85rem; color: #475569; margin-bottom: 12px; font-style: italic; }
        .coin-meta { border-top: 1px solid var(--border); padding-top: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 0.85rem; margin-top: auto; }
        .meta-box { display: flex; flex-direction: column; gap: 3px; }
        .meta-box label { display: block; color: #64748b; font-size: 0.75rem; }
        .meta-box select, .meta-box input { width: 100%; padding: 6px; border: 1px solid var(--border); border-radius: 4px; font-size: 0.85rem; background: #fff; }
        .price-tag { grid-column: span 2; background: #f1f5f9; padding: 8px; border-radius: 6px; text-align: center; font-weight: bold; font-size: 0.95rem; color: var(--primary); }
        .ownership-toggle { grid-column: span 2; display: flex; align-items: center; gap: 8px; margin-top: 8px; cursor: pointer; font-weight: 600; font-size: 0.9rem; user-select: none; }
        .card-actions { grid-column: span 2; display: flex; justify-content: space-between; margin-top: 12px; border-top: 1px solid var(--border); padding-top: 10px; }
        .not-owned { filter: grayscale(0.7); opacity: 0.65; }
        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); color: white; display: flex; justify-content: center; align-items: center; font-size: 1.5rem; z-index: 1000; display: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loading">💾 Sincronizando datos...</div>
    <header>
        <div class="header-title"><h1>EuroNumis Cloud</h1><p>Conectado en vivo a Google Sheets</p></div>
        <div style="display: flex; gap: 10px;">
            <button class="btn btn-add" onclick="abrirFormularioNuevo()">+ Nueva Moneda</button>
            <button class="btn btn-excel" onclick="exportToExcel()">📊 Exportar Excel</button>
        </div>
        <div class="stats-panel">
            <p>Monedas: <span id="stat-count">0</span> / <span id="stat-total">0</span></p>
            <p>Valor total: <span id="stat-value">0.00 €</span></p>
        </div>
    </header>
    <section class="admin-section" id="admin-form">
        <h3 id="form-title">Añadir Nueva Moneda</h3>
        <form id="new-coin-form" onsubmit="saveCoin(event)">
            <input type="hidden" id="edit-id">
            <input type="hidden" id="edit-image-base64">
            <div class="form-grid">
                <div class="filter-group"><label>País</label><input type="text" id="add-country" required></div>
                <div class="filter-group"><label>Año</label><input type="number" id="add-year" required min="1999" max="2030"></div>
                <div class="filter-group"><label>Tema / Descripción</label><input type="text" id="add-theme" required></div>
                <div class="filter-group"><label>Volumen de Acuñación</label><input type="number" id="add-mintage"></div>
                <div class="filter-group">
                    <label>Tipo</label>
                    <select id="add-type"><option value="conmemorativa">Conmemorativa</option><option value="regular">Regular / Común</option></select>
                </div>
                <div class="filter-group"><label>Precio Base Est. (€)</label><input type="number" step="0.01" id="add-price" required></div>
                <div class="filter-group"><label>Imagen de la Moneda</label><input type="file" id="add-image" accept="image/*" onchange="convertImageToBase64()"></div>
            </div>
            <div style="margin-top: 15px; display: flex; gap: 10px;">
                <button type="submit" class="btn btn-excel">💾 Guardar Cambios</button>
                <button type="button" class="btn" onclick="document.getElementById('admin-form').style.display='none'">Cancelar</button>
            </div>
        </form>
    </section>
    <section class="filters-section">
        <div class="filter-group"><label>Buscar Tema</label><input type="text" id="search-theme" placeholder="Ej. Don Quijote..." oninput="filterCoins()"></div>
        <div class="filter-group"><label>País</label><select id="filter-country" onchange="filterCoins()"><option value="">Todos los países</option></select></div>
        <div class="filter-group"><label>Año</label><select id="filter-year" onchange="filterCoins()"><option value="">Todos los años</option></select></div>
        <div class="filter-group"><label>Estado de la Colección</label><select id="filter-status" onchange="filterCoins()"><option value="">Todas las monedas</option><option value="owned">En mi poder</option><option value="not-owned">Faltantes</option></select></div>
    </section>
    <main class="coins-grid" id="coins-container"></main>

    <script>
        var SCRIPT_URL = "https://google.com";
        var localCoins = [
            { id: "1", country: "España", year: 2005, theme: "IV Centenario de Don Quijote", mintage: 8000000, type: "conmemorativa", price: 3.50, image: "", owned: true, condition: "VF", notes: "Primera de España" },
            { id: "2", country: "Francia", year: 2024, theme: "Juegos Olímpicos de París 2024", mintage: 24000000, type: "conmemorativa", price: 2.50, image: "", owned: false, condition: "UNC", notes: "Falta conseguir" },
            { id: "3", country: "Alemania", year: 2006, theme: "Puerta de Brandenburgo", mintage: 30000000, type: "regular", price: 2.00, image: "", owned: true, condition: "XF", notes: "Serie común" }
        ];
        window.addEventListener("DOMContentLoaded", function() { inicializarApp(); });
        function showLoading(show) { document.getElementById("loading").style.display = show ? "flex" : "none"; }
        function inicializarApp() {
            showLoading(true);
if (typeof google !== "undefined" && google.script && google.script.run) {google.script.run.withSuccessHandler(function(data){ if (data && data.length > 0) localCoins = data; renderApp(); showLoading(false); }).withFailureHandler(function(){ renderApp(); showLoading(false); }).obtenerMonedas();} else if (SCRIPT_URL !== "") {fetch(SCRIPT_URL).then(function(res){ return res.json(); }).then(function(data){ if (data && data.length > 0) localCoins = data; renderApp(); showLoading(false); }).catch(function(){ cargarRespaldoLocal(); });} else { cargarRespaldoLocal(); }}function cargarRespaldoLocal() { var saved = localStorage.getItem("euroNumisData"); if (saved) localCoins = JSON.parse(saved); renderApp(); showLoading(false); }function renderApp() { populateFilterOptions(); filterCoins(); }function populateFilterOptions() {var countrySelect = document.getElementById("filter-country"); var yearSelect = document.getElementById("filter-year");var currentCountry = countrySelect.value; var currentYear = yearSelect.value;countrySelect.innerHTML = "Todos los países"; yearSelect.innerHTML = "Todos los años";var countries = []; var years = [];localCoins.forEach(function(c){ if (countries.indexOf(c.country) === -1) countries.push(c.country); if (years.indexOf(c.year) === -1) years.push(c.year); });countries.sort(); years.sort(function(a,b){ return b-a; });countries.forEach(function(c){ var opt = document.createElement("option"); opt.value = opt.textContent = c; countrySelect.appendChild(opt); });years.forEach(function(y){ var opt = document.createElement("option"); opt.value = opt.textContent = y; yearSelect.appendChild(opt); });countrySelect.value = currentCountry; yearSelect.value = currentYear;}function filterCoins() {var searchText = document.getElementById("search-theme").value.toLowerCase(); var countryFilter = document.getElementById("filter-country").value; var yearFilter = document.getElementById("filter-year").value; var statusFilter = document.getElementById("filter-status").value;var filtered = localCoins.filter(function(coin){var matchText = coin.theme.toLowerCase().indexOf(searchText) !== -1 || coin.country.toLowerCase().indexOf(searchText) !== -1; var matchCountry = !countryFilter || coin.country === countryFilter; var matchYear = !yearFilter || coin.year.toString() === yearFilter; var matchStatus = !statusFilter || (statusFilter === "owned" ? coin.owned : !coin.owned); return matchText && matchCountry && matchYear && matchStatus;});renderGrid(filtered); calculateStats();}function calculateStats() {var ownedCoins = localCoins.filter(function(c){ return c.owned; }); document.getElementById("stat-count").textContent = ownedCoins.length; document.getElementById("stat-total").textContent = localCoins.length;var totalValue = ownedCoins.reduce(function(acc,curr){ return acc + (parseFloat(curr.price) || 0); }, 0); document.getElementById("stat-value").textContent = totalValue.toFixed(2) + " €";}function renderGrid(coins) {var container = document.getElementById("coins-container"); container.innerHTML = "";if (coins.length === 0) { container.innerHTML = "No hay monedas.'; return; }coins.forEach(function(coin){var card = document.createElement("article"); card.className = "coin-card " + (coin.owned ? "" : "not-owned");var imgHTML = coin.image ? "" : "Sin fotografía";var selectUNC = coin.condition === "UNC" ? "selected" : ""; var selectXF = coin.condition === "XF" ? "selected" : ""; var selectVF = coin.condition === "VF" ? "selected" : ""; var checkOwned = coin.owned ? "checked" : "";card.innerHTML = "" + coin.type.toUpperCase() + "" + imgHTML + "" + coin.country + " • " + coin.year + "" + coin.theme + "" + (coin.mintage ? "Acuñación: " + parseInt(coin.mintage).toLocaleString() : "Acuñación: N/A") + "Valor: " + (parseFloat(coin.price) || 0).toFixed(2) + " €Conservación<option value='UNC' " + selectUNC + ">UNC<option value='XF' " + selectXF + ">XF<option value='VF' " + selectVF + ">VFNotas<input type='checkbox' " + checkOwned + " onchange='toggleOwnership("" + coin.id + "", this.checked)'>¿La tengo?✏️ Editar🗑️ Borrar";container.appendChild(card);});}function updateCardMeta(id, prop, val) { var index = localCoins.findIndex(function(c){ return c.id === id; }); if (index !== -1) { localCoins[index][prop] = val; persistData(); } }function toggleOwnership(id, chk) { var index = localCoins.findIndex(function(c){ return c.id === id; }); if (index !== -1) { localCoins[index].owned = chk; persistData(); filterCoins(); } }function abrirFormularioNuevo() { document.getElementById("new-coin-form").reset(); document.getElementById("edit-id").value = ""; document.getElementById("edit-image-base64").value = ""; document.getElementById("form-title").textContent = "Añadir Nueva Moneda"; document.getElementById("admin-form").style.display = "block"; window.scrollTo({ top: 0, behavior: "smooth" }); }function abrirFormularioEditar(id) { const coin = localCoins.find(function(c){ return c.id === id; }); if (!coin) return; document.getElementById("edit-id").value = coin.id; document.getElementById("add-country").value = coin.country; document.getElementById('add-year').value = coin.year; document.getElementById("add-theme").value = coin.theme; document.getElementById("add-mintage").value = coin.mintage || ""; document.getElementById("add-type").value = coin.type; document.getElementById("add-price").value = coin.price; document.getElementById("edit-image-base64").value = coin.image || ""; document.getElementById("form-title").textContent = "Editar Moneda"; document.getElementById("admin-form").style.display = "block"; window.scrollTo({ top: 0, behavior: "smooth" }); }function convertImageToBase64() { var files = document.getElementById("add-image").files; if (files.length === 0) return; var reader = new FileReader(); reader.onload = function(e) { document.getElementById("edit-image-base64").value = e.target.result; }; reader.readAsDataURL(files[0]); }function saveCoin(event) { event.preventDefault(); showLoading(true); var id = document.getElementById("edit-id").value; var isEdit = id && id.trim() !== ""; var currentCoin = isEdit ? localCoins.find(function(c){ return c.id === id; }) : null; var coinData = { id: isEdit ? id : Date.now().toString(), country: document.getElementById("add-country").value.trim(), year: parseInt(document.getElementById("add-year").value), theme: document.getElementById("add-theme").value.trim(), mintage: document.getElementById("add-mintage").value ? parseInt(document.getElementById("add-mintage").value) : "", type: document.getElementById("add-type").value, price: parseFloat(document.getElementById("add-price").value) || 0, image: document.getElementById("edit-image-base64").value, owned: isEdit ? currentCoin.owned : false, condition: isEdit ? currentCoin.condition : "UNC", notes: isEdit ? currentCoin.notes : "" }; if (isEdit) { var index = localCoins.findIndex(function(c){ return c.id === id; }); if (index !== -1) localCoins[index] = coinData; } else { localCoins.push(coinData); } if (SCRIPT_URL !== "") { fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify(coinData) }).then(function(){ document.getElementById("admin-form").style.display = "none"; inicializarApp(); }).catch(function(){ fallbackLocalSave(coinData); }); } else { fallbackLocalSave(coinData); } }function fallbackLocalSave(coinData) { persistData(); document.getElementById("admin-form").style.display = "none"; renderApp(); showLoading(false); }function deleteCoin(id) { if (!confirm("¿Eliminar moneda?")) return; showLoading(true); localCoins = localCoins.filter(function(c){ return c.id !== id; }); persistData(); renderApp(); showLoading(false); }function persistData() { localStorage.setItem("euroNumisData", JSON.stringify(localCoins)); }function exportToExcel() { var csvContent = "data:text/csv;charset=utf-8,\uFEFFID;País;Año;Tema;Acuñación;Tipo;Precio (€);Coleccionada;Conservación;Notas\r\n"; localCoins.forEach(function(c){ csvContent += [c.id, '"' + c.country + '"', c.year, '"' + c.theme.replace(/"/g, '""') + '"', c.mintage || 'N/A', c.type, c.price.toFixed(2), c.owned ? "SÍ" : "NO", c.condition || 'UNC', '"' + (c.notes || '').replace(/"/g, '""') + '"'].join(";") + "\r\n"; }); var encodedUri = encodeURI(csvContent); var link = document.createElement("a"); link.setAttribute("href", encodedUri); link.setAttribute("download", "Coleccion_EuroNumis.csv"); document.body.appendChild(link); link.click(); document.body.removeChild(link); }
