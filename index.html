        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-top: 15px; }
        .filters-section { background: var(--card-bg); padding: 20px; border-radius: 12px; margin-bottom: 25px; box-shadow: 0 1px 3px rgb(0 0 0 / 0.1); display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }

        .coin-card { background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; position: relative; transition: transform 0.2s; display: flex; flex-direction: column; }
        .coin-card:hover { transform: translateY(-5px); }
        .coin-img-container { width: 100%; height: 180px; background-color: #f1f5f9; display: flex; align-items: center; justify-content: center; overflow: hidden; border-bottom: 1px solid var(--border); position: relative; }
        .coin-img-container img { width: auto; height: 100%; object-fit: contain; }
        .no-img-text { color: #94a3b8; font-size: 0.9rem; font-style: italic; }
        .coin-badge { position: absolute; top: 15px; right: 15px; padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; z-index: 10; }
        .badge-conmemorativa { background-color: #fee2e2; color: #991b1b; }
        .badge-regular { background-color: #e0f2fe; color: #075985; }
        .coin-info { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; }
        .coin-country-year { font-size: 0.85rem; text-transform: uppercase; font-weight: bold; color: #64748b; }
        .coin-theme { font-size: 1.1rem; font-weight: 700; color: var(--primary); margin: 8px 0; min-height: 50px; }
        .coin-mintage { font-size: 0.85rem; color: #475569; margin-bottom: 12px; font-style: italic; }
        .coin-meta { border-top: 1px solid var(--border); padding-top: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 0.85rem; margin-top: auto; }
        .meta-box { display: flex; flex-direction: column; gap: 3px; }
        .meta-box label { display: block; color: #64748b; font-size: 0.75rem; }
        .meta-box select, .meta-box input { width: 100%; padding: 6px; border: 1px solid var(--border); border-radius: 4px; font-size: 0.85rem; background: #fff; }
        .price-tag { grid-column: span 2; background: #f1f5f9; padding: 8px; border-radius: 6px; text-align: center; font-weight: bold; font-size: 0.95rem; color: var(--primary); }
        .ownership-toggle { grid-column: span 2; display: flex; align-items: center; gap: 8px; margin-top: 8px; cursor: pointer; font-weight: 600; font-size: 0.9rem; user-select: none; }
        .card-actions { grid-column: span 2; display: flex; justify-content: space-between; margin-top: 12px; border-top: 1px solid var(--border); padding-top: 10px; }

    <script>
        var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzzsZAU0By1pPU8TG5_hrlNjlUVMQjZADFJrFuH3bAGq7JK66dprlxU6pL7Gfu3kan8DA/exec";
        var localCoins = [];

        window.addEventListener("DOMContentLoaded", function() { inicializarApp(); });
        function showLoading(show) { document.getElementById("loading").style.display = show ? "flex" : "none"; }

        function inicializarApp() {
    showLoading(true);
    
    // 1. Cargar el respaldo local rápido para que la pantalla no aparezca vacía mientras se conecta a internet
    var saved = localStorage.getItem("euroNumisData");
    if (saved) { localCoins = JSON.parse(saved); }
    renderApp();

    // 2. Conectarse a Google Sheets en tiempo real para traer las monedas desde cualquier computadora
    if (SCRIPT_URL !== "") {
        var urlLectura = SCRIPT_URL + "?action=read";
        
        // Usamos un script invisible para saltarnos el bloqueo CORS de Google de forma definitiva
        var script = document.createElement("script");
        script.src = urlLectura + "&callback=handleGoogleSheetsData";
        
        // Si Google tarda en responder o no hay internet, se queda con la copia local de la PC
        var timeoutUrl = setTimeout(function() {
            showLoading(false);
            document.body.removeChild(script);
        }, 5000);
        
        window.handleGoogleSheetsData = function(data) {
            clearTimeout(timeoutUrl);
            if (data && data.length > 0) {
                localCoins = data;
                persistData(); // Sincroniza la PC actual con la nube
                renderApp();   // Dibuja las monedas de la nube en la pantalla
            }
            showLoading(false);
            try { document.body.removeChild(script); } catch(e){}
        };
        
        document.body.appendChild(script);
    } else {
        showLoading(false);
    }
}


        function renderApp() { populateFilterOptions(); filterCoins(); }

        function populateFilterOptions() {
            var countrySelect = document.getElementById("filter-country"); var yearSelect = document.getElementById("filter-year");
            var currentCountry = countrySelect.value; var currentYear = yearSelect.value;
            countrySelect.innerHTML = "<option value=''>Todos los países</option>"; yearSelect.innerHTML = "<option value=''>Todos los años</option>";
            var countries = []; var years = [];
            localCoins.forEach(function(c){ if (countries.indexOf(c.country) === -1) countries.push(c.country); if (years.indexOf(c.year) === -1) years.push(c.year); });
            countries.sort(); years.sort(function(a,b){ return b-a; });
            countries.forEach(function(c){ var opt = document.createElement("option"); opt.value = opt.textContent = c; countrySelect.appendChild(opt); });
            years.forEach(function(y){ var opt = document.createElement("option"); opt.value = opt.textContent = y; yearSelect.appendChild(opt); });
            countrySelect.value = currentCountry; yearSelect.value = currentYear;
        }

        function filterCoins() {
    var searchText = document.getElementById("search-theme").value.toLowerCase(); 
    var countryFilter = document.getElementById("filter-country").value; 
    var yearFilter = document.getElementById("filter-year").value; 
    var statusFilter = document.getElementById("filter-status").value;
    
    var filtered = localCoins.filter(function(coin){
        // Convierte el tema y país a texto estrictamente para evitar que celdas vacías o números rompan la web
        var temaTxt = (coin.theme || "").toString().toLowerCase();
        var paisTxt = (coin.country || "").toString().toLowerCase();
        
        var matchText = temaTxt.indexOf(searchText) !== -1 || paisTxt.indexOf(searchText) !== -1; 
        var matchCountry = countryFilter === "" || (coin.country || "").toString() === countryFilter; 
        var matchYear = yearFilter === "" || (coin.year || "").toString() === yearFilter; 
        var matchStatus = statusFilter === "" || (statusFilter === "owned" ? coin.owned : !coin.owned); 
        
        return matchText && matchCountry && matchYear && matchStatus;
    });
    renderGrid(filtered); 
    calculateStats();
}

        function calculateStats() {
            var ownedCoins = localCoins.filter(function(c){ return c.owned; }); document.getElementById("stat-count").textContent = ownedCoins.length; document.getElementById("stat-total").textContent = localCoins.length;
            var totalValue = ownedCoins.reduce(function(acc,curr){ return acc + (parseFloat(curr.price) || 0); }, 0); document.getElementById("stat-value").textContent = totalValue.toFixed(2) + " €";
        }

        function renderGrid(coins) {
            var container = document.getElementById("coins-container"); container.innerHTML = "";
            if (coins.length === 0) { container.innerHTML = "<div style='grid-column:1/-1;text-align:center;padding:40px;color:#64748b;'>No hay monedas.</div>"; return; }
            coins.forEach(function(coin){
                var card = document.createElement("article"); card.className = "coin-card " + (coin.owned ? "" : "not-owned");
                var imgHTML = coin.image ? "<img src='" + coin.image + "' alt='" + coin.theme + "'>" : "<span class='no-img-text'>Sin fotografía</span>";
                var selectUNC = coin.condition === "UNC" ? "selected" : ""; var selectXF = coin.condition === "XF" ? "selected" : ""; var selectVF = coin.condition === "VF" ? "selected" : ""; var checkOwned = coin.owned ? "checked" : "";
                //card.innerHTML = "<div class='coin-img-container'><span class='coin-badge badge-" + coin.type + "'>" + coin.type.toUpperCase() + "</span>" + imgHTML + "</div><div class='coin-info'><div class='coin-country-year'>" + coin.country + " • " + coin.year + "</div><h2 class='coin-theme'>" + coin.theme + "</h2><div class='coin-mintage'>" + (coin.mintage ? "Acuñación: " + parseInt(coin.mintage).toLocaleString() : "Acuñación: N/A") + "</div><div class='coin-meta'><div class='price-tag'>Valor: " + (parseFloat(coin.price) || 0).toFixed(2) + " €</div><div class='meta-box'><label>Conservación</label><select onchange='updateCardMeta(\"" + coin.id + "\", \"condition\", this.value)'><option value='UNC' " + selectUNC + ">UNC</option><option value='XF' " + selectXF + ">XF</option><option value='VF' " + selectVF + ">VF</option></select></div><div class='meta-box'><label>Notas</label><input type='text' value='" + (coin.notes || "") + "' onchange='updateCardMeta(\"" + coin.id + "\", \"notes\", this.value\")'></div><label class='ownership-toggle'><input type='checkbox' " + checkOwned + " onchange='toggleOwnership(\"" + coin.id + "\", this.checked)'><span>¿La tengo?</span></label><div class='card-actions'><button class='btn-edit-green' data-admin='true' onclick='abrirFormularioEditar(\"" + coin.id + "\")'>✏️ Editar</button><button class='btn-delete-red' data-admin='true' onclick='deleteCoin(\"" + coin.id + "\")'>🗑️ Borrar</button></div></div></div>";
                //card.innerHTML = "<div class='coin-img-container'><span class='coin-badge badge-" + coin.type + "'>" + coin.type.toUpperCase() + "</span>" + imgHTML + "</div><div class='coin-info'><div class='coin-country-year'>" + coin.country + " • " + coin.year + "</div><h2 class='coin-theme'>" + coin.theme + "</h2><div class='coin-mintage'>" + (coin.mintage ? "Acuñación: " + parseInt(coin.mintage).toLocaleString() : "Acuñación: N/A") + "</div><div class='coin-meta'><div class='price-tag'>Valor: " + (parseFloat(coin.price) || 0).toFixed(2) + " €</div><div class='meta-box'><label>Conservación</label><select onchange='updateCardMeta(\"" + coin.id + "\", \"condition\", this.value)'><option value='UNC' " + selectUNC + ">UNC</option><option value='XF' " + selectXF + ">XF</option><option value='VF' " + selectVF + ">VF</option></select></div><div class='meta-box'><label>Notas</label><input type='text' value='" + (coin.notes || "") + "' onchange='updateCardMeta(\"" + coin.id + "\", \"notes\", this.value\")'></div><label class='ownership-toggle'><input type='checkbox' " + checkOwned + " onchange='toggleOwnership(\"" + coin.id + "\", this.checked)'><span>¿La tengo?</span></label><div class='card-actions'><button class='btn-edit-green' data-admin='true' onclick='abrirFormularioEditar(\"" + coin.id + "\")'>✏️ Editar</button><button class='btn-delete-red' data-admin='true' onclick='deleteCoin(\"" + coin.id + "\", this)'>🗑️ Borrar</button></div></div></div>";

                card.innerHTML = "<div class='coin-img-container'><span class='coin-badge badge-" + coin.type + "'>" + coin.type.toUpperCase() + "</span>" + imgHTML + "</div><div class='coin-info'><div class='coin-country-year'>" + coin.country + " • " + coin.year + "</div><h2 class='coin-theme'>" + coin.theme + "</h2><div class='coin-mintage'>" + (coin.mintage ? "Acuñación: " + parseInt(coin.mintage).toLocaleString() : "Acuñación: N/A") + "</div><div class='coin-meta'><div class='price-tag'>Valor: " + (parseFloat(coin.price) || 0).toFixed(2) + " €</div><div class='meta-box'><label>Conservación</label><select onchange='updateCardMeta(\"" + coin.id + "\", \"condition\", this.value)'><option value='UNC' " + selectUNC + ">UNC</option><option value='XF' " + selectXF + ">XF</option><option value='VF' " + selectVF + ">VF</option></select></div><div class='meta-box'><label>Notas</label><input type='text' value='" + (coin.notes || "") + "' onchange='updateCardMeta(\"" + coin.id + "\", \"notes\", this.value\")'></div><label class='ownership-toggle'><input type='checkbox' " + checkOwned + " onchange='toggleOwnership(\"" + coin.id + "\", this.checked)'><span>¿La tengo?</span></label><div class='card-actions'><button class='btn-add btn-edit-green' data-admin='true' onclick='abrirFormularioEditar(\"" + coin.id + "\", this)'>✏️ Editar</button><button class='btn-add btn-delete-red' data-admin='true' onclick='deleteCoin(\"" + coin.id + "\", this)'>🗑️ Borrar</button></div></div></div>";


                //card.innerHTML = "<div class='coin-img-container'><span class='coin-badge badge-" + coin.type + "'>" + coin.type.toUpperCase() + "</span>" + imgHTML + "</div><div class='coin-info'><div class='coin-country-year'>" + coin.country + " • " + coin.year + "</div><h2 class='coin-theme'>" + coin.theme + "</h2><div class='coin-mintage'>" + (coin.mintage ? "Acuñación: " + parseInt(coin.mintage).toLocaleString() : "Acuñación: N/A") + "</div><div class='coin-meta'><div class='price-tag'>Valor: " + (parseFloat(coin.price) || 0).toFixed(2) + " €</div><div class='meta-box'><label>Conservación</label><select onchange='updateCardMeta(\"" + coin.id + "\", \"condition\", this.value)'><option value='UNC' " + selectUNC + ">UNC</option><option value='XF' " + selectXF + ">XF</option><option value='VF' " + selectVF + ">VF</option></select></div><div class='meta-box'><label>Notas</label><input type='text' value='" + (coin.notes || "") + "' onchange='updateCardMeta(\"" + coin.id + "\", \"notes\", this.value\")'></div><label class='ownership-toggle'><input type='checkbox' " + checkOwned + " onchange='toggleOwnership(\"" + coin.id + "\", this.checked)'><span>¿La tengo?</span></label><div class='card-actions'><button class='btn btn-add' data-admin='true' onclick='abrirFormularioEditar(\"" + coin.id + "\")'>✏️ Editar</button><button class='btn btn-add' data-admin='true' class='btn-danger' onclick='deleteCoin(\"" + coin.id + "\")'>🗑️ Borrar</button></div></div></div>";
                container.appendChild(card);
            });
        }
        
        function updateCardMeta(id, prop, val) { var index = localCoins.findIndex(function(c){ return c.id === id; }); if (index !== -1) { localCoins[index][prop] = val; persistData(); } }
        function toggleOwnership(id, chk) { var index = localCoins.findIndex(function(c){ return c.id === id; }); if (index !== -1) { localCoins[index].owned = chk; persistData(); filterCoins(); } }
        function abrirFormularioNuevo() { 
            document.getElementById("new-coin-form").reset(); 
            document.getElementById("edit-id").value = ""; 
            document.getElementById("edit-image-base64").value = ""; 
            document.getElementById("form-title").textContent = "Añadir Nueva Moneda"; 
            document.getElementById("admin-form").style.display = "block"; 
            window.scrollTo({ top: 0, behavior: 'smooth' }); 
        }
        
       function abrirFormularioEditar(id, boton) {
            // 1. Validar seguridad en el frontend usando el atributo data-admin del botón
            if (!boton || boton.getAttribute("data-admin") !== "true") {
                console.error("Acceso denegado: No tienes permisos de administrador.");
                alert("No tienes permisos para realizar esta acción.");
                return;
            }

            // 2. Buscar el elemento en la base de datos local
            var coin = localCoins.find(function(c){ 
                return c.id === id; 
            });
            if (!coin) return;
        
            // 3. Rellenar el formulario con los datos de la moneda
            document.getElementById("edit-id").value = coin.id;
            document.getElementById("add-country").value = coin.country;
            document.getElementById("add-year").value = coin.year;
            document.getElementById("add-theme").value = coin.theme;
            document.getElementById("add-mintage").value = coin.mintage || "";
            document.getElementById("add-type").value = coin.type;
            document.getElementById("add-price").value = coin.price;
            document.getElementById("edit-image-base64").value = coin.image || "";
        
            // 4. Mostrar el formulario visualmente
            document.getElementById("form-title").textContent = "Editar Moneda";
            document.getElementById("admin-form").style.display = "block";
            
            window.scrollTo({ top: 0, behavior: "smooth" });
        }

    function convertImageToBase64() {
            var files = document.getElementById("add-image").files;
            if (!files || files.length === 0) {
                document.getElementById("edit-image-base64").value = "";
                return;
            }
            var reader = new FileReader();
            reader.onload = function(e) {
                var img = new Image();
                img.onload = function() {
                    var canvas = document.createElement("canvas");
                    var max_size = 300; // Reduce la foto a un tamaño óptimo para celdas
                    var width = img.width;
                    var height = img.height;
                    if (width > height) {
                        if (width > max_size) { height *= max_size / width; width = max_size; }
                    } else {
                        if (height > max_size) { width *= max_size / height; height = max_size; }
                    }
                    canvas.width = width;
                    canvas.height = height;
                    var ctx = canvas.getContext("2d");
                    ctx.drawImage(img, 0, 0, width, height);
                    // Comprime el archivo a formato JPEG ligero
                    var dataUrl = canvas.toDataURL("image/jpeg", 0.7);
                    document.getElementById("edit-image-base64").value = dataUrl;
                    console.log("Imagen comprimida y lista para la nube.");
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(files[0]);
        }

function saveCoin(event) { 
    event.preventDefault(); 
    showLoading(true); 
    var id = document.getElementById("edit-id").value; 
    var isEdit = id && id.trim() !== ""; 
    var currentCoin = isEdit ? localCoins.find(function(c){ return c.id === id; }) : null; 
    
    var coinData = { 
        id: isEdit ? id : Date.now().toString(), 
        country: document.getElementById("add-country").value.trim(), 
        year: parseInt(document.getElementById("add-year").value), 
        theme: document.getElementById("add-theme").value.trim(), 
        mintage: document.getElementById("add-mintage").value ? parseInt(document.getElementById("add-mintage").value) : "", 
        type: document.getElementById("add-type").value, 
        price: parseFloat(document.getElementById("add-price").value) || 0, 
        image: document.getElementById("edit-image-base64").value || "", 
        owned: isEdit ? currentCoin.owned : false, 
        condition: isEdit ? currentCoin.condition : "UNC", 
        notes: isEdit ? currentCoin.notes : "" 
    }; 
    
    if (isEdit) { 
        var index = localCoins.findIndex(function(c){ return c.id === id; }); 
        if (index !== -1) localCoins[index] = coinData; 
    } else { 
        localCoins.push(coinData); 
    } 
    
    // 1. PASO LOCAL: Guardar en memoria y pintar en pantalla inmediatamente
    persistData(); 
    document.getElementById("admin-form").style.display = "none"; 
    renderApp(); 
    showLoading(false); 

    // 2. PASO REMOTO: Enviar en formato JSON plano garantizado a Google Sheets
    if (SCRIPT_URL !== "") { 
        fetch(SCRIPT_URL, { 
            method: "POST", 
            mode: "no-cors", 
            headers: { "Content-Type": "application/json" }, 
            body: JSON.stringify(coinData) 
        }).catch(function(e){ console.log("Sincronizando..."); });
    } 
}

function fallbackLocalSave(coinData) { 
    persistData(); 
    document.getElementById("admin-form").style.display = "none"; 
    renderApp(); 
    showLoading(false); 
}

function deleteCoin(id, boton) {
    // 1. Validar seguridad en el frontend usando el atributo data-admin del botón (Funciona igual que Editar)
    if (!boton || boton.getAttribute("data-admin") !== "true") {
        console.error("Acceso denegado: No tienes permisos de administrador.");
        alert("No tienes permisos para realizar esta acción.");
        return;
    }
    
    // 2. Confirmación visual antes de proceder
    if (!confirm("¿Eliminar moneda?")) return;
    showLoading(true);
    
    localCoins = localCoins.filter(function(c) { return c.id !== id; });
    persistData();
    renderApp();
    showLoading(false);

    if (SCRIPT_URL !== "") {
        fetch(SCRIPT_URL, { 
            method: "POST", 
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action: "delete", id: id })
        }).catch(function(e){});
    }
}

function persistData() { 
    localStorage.setItem("euroNumisData", JSON.stringify(localCoins)); 
}

function exportToExcel() { 
    var csvContent = "data:text/csv;charset=utf-8,\uFEFFID;País;Año;Tema;Acuñación;Tipo;Precio (€);Coleccionada;Conservación;Notas\r\n"; 
    localCoins.forEach(function(c){ 
        csvContent += [c.id, '"' + c.country + '"', c.year, '"' + c.theme.replace(/"/g, '""') + '"', c.mintage || 'N/A', c.type, c.price.toFixed(2), c.owned ? "SÍ" : "NO", c.condition || 'UNC', '"' + (c.notes || '').replace(/"/g, '""') + '"'].join(";") + "\r\n"; 
    }); 
    var encodedUri = encodeURI(csvContent); 
    var link = document.createElement("a"); 
    link.setAttribute("href", encodedUri); 
    link.setAttribute("download", "Coleccion_EuroNumis.csv"); 
    document.body.appendChild(link); 
    link.click(); 
    document.body.removeChild(link); 
}

// Decodificador seguro universal sin errores de sintaxis
function parseJwt(token) {
    try {
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
            return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));
        return JSON.parse(jsonPayload);
    } catch (error) {
        console.error("Error al decodificar la identidad:", error);
        return {};
    }
}

    // Función matemática matemática estándar para encriptar en segundos
    async function generarSHA256(mensaje) {
        const msgBuffer = new TextEncoder().encode(mensaje);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }
